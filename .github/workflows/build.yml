name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test provider models and event ordering
        run: |
          swiftc -swift-version 6 \
            NotchBuddy/Sources/App/WorkModels.swift \
            NotchBuddy/Sources/App/RemoteAccountModels.swift \
            NotchBuddy/Tests/WorkModelsTests.swift \
            -o "$RUNNER_TEMP/work-model-tests"
          "$RUNNER_TEMP/work-model-tests"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Build macOS app
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            -derivedDataPath work-build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build sandboxed variant
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouAppStore \
            -configuration Debug \
            -derivedDataPath work-store-build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package review app with executable permissions
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            work-build/Build/Products/Release/Coucou.app \
            "$RUNNER_TEMP/Coucou-macos-unsigned.zip"

      - name: Upload unsigned macOS app for review
        uses: actions/upload-artifact@v4
        with:
          name: coucou-macos-unsigned
          path: ${{ runner.temp }}/Coucou-macos-unsigned.zip
          retention-days: 7
